#:schema file://./mosaic-spec-toml-schema.json

[convert]
sources = [{ id = "mosaic", path = "../../spec/dist/mosaic-schema.json" }]

[convert.to_mlir]
ref_unwrap = { Curve = { description = "outer" } }

[[convert.to_mlir.actions]]
action                         = "remove"
scope.include.definition.names = ["Spec"]

[[convert.to_mlir.actions]]
action                         = "new-tree"
id                             = "params"
scope.include.definition.names = ["ParamDefinition", "Params"]
scope.over                     = "descendants"
scope.ref_follow_depth         = 6

[[convert.to_mlir.actions]]
action                         = "new-tree"
id                             = "typing"
scope.include.id               = ["mosaic"]
# TODO: `ColorScheme` Needs to remove 1x `Record<never, never>`
scope.include.definition.names = [
  "ChannelDomainValue",
  "ColorScaleType",
  "ColorScheme",
  "ContinuousScaleType",
  "Curve",
  "DiscreteScaleType",
  "Fixed",
  "FrameAnchor",
  "GridInterpolate",
  "Interpolate",
  "Interval",
  "LabelArrow",
  "MarkerName",
  "PositionScaleType",
  "ProjectionName",
  "Reducer",
  "ScaleName",
  "SelectFilter",
  "StackOffset",
  "StackOrder",
  "SymbolType",
  "TipPointer",
  "VectorShape",
]
scope.over                     = "descendants"
scope.ref_follow_depth         = 2

# TODO: `SpecDeduplicate`

[[convert.to_mlir.actions]]
action                         = "new-tree"
id                             = "css_styles"
scope.include.id               = ["mosaic"]
scope.include.definition.names = ["CSSStyles"]

[[convert.to_mlir.actions]]
action                         = "new-tree"
id                             = "interactors"
scope.include.id               = ["mosaic"]
scope.include.definition.names = ["PlotInteractor"]
scope.over                     = "descendants"
scope.ref_follow_depth         = 2

[[convert.to_mlir.actions]]
action                         = "new-tree"
id                             = "transform"
scope.include.id               = ["mosaic"]
scope.include.definition.names = ["Transform", "IntervalTransform"]
scope.over                     = "descendants"
scope.ref_follow_depth         = 10

[[convert.to_mlir.actions]]
action                         = "new-tree"
id                             = "data"
scope.include.id               = ["mosaic"]
scope.include.definition.names = ["DataDefinition", "Data"]
scope.over                     = "descendants"
scope.ref_follow_depth         = 1

[[convert.to_mlir.actions]]
action                         = "new-tree"
id                             = "expression"
scope.include.id               = ["mosaic"]
scope.include.definition.names = ["AggregateExpression", "SQLExpression"]

[[convert.to_mlir.actions]]
action                         = "new-tree"
id                             = "inputs"
scope.include.id               = ["mosaic"]
scope.include.definition.names = ["Menu", "Search", "Slider", "Table"]

[[convert.to_mlir.actions]]
action                         = "new-tree"
id                             = "layout"
scope.include.id               = ["mosaic"]
scope.include.definition.names = ["HConcat", "VConcat", "HSpace", "VSpace"]
into_ext_ref                   = { "Component" = "mosaic" }

[[convert.to_mlir.actions]]
action                         = "new-tree"
id                             = "plot_from"
scope.include.id               = ["mosaic"]
scope.include.definition.names = ["PlotMarkData"]
scope.over                     = "descendants"
scope.ref_follow_depth         = 1

[[convert.to_mlir.actions]]
action                         = "new-tree"
id                             = "marks"
scope.include.id               = ["mosaic"]
# NOTE: `ChannelDomainSort` is reachable from `PlotMark`,
# but MLIR field order is not deterministic and many things need to align for this to work.
scope.include.definition.names = ["PlotMark", "ChannelDomainSort"]
scope.over                     = "descendants"
scope.ref_follow_depth         = 3

[[convert.to_mlir.actions]]
action                         = "new-tree"
id                             = "plot_legend"
scope.include.id               = ["mosaic"]
scope.include.definition.names = ["Legend", "PlotLegend"]

[[convert.to_mlir.actions]]
action                         = "new-tree"
id                             = "plot"
scope.include.id               = ["mosaic"]
scope.include.definition.names = ["PlotAttributes", "Plot"]

[[convert.to_mlir.actions]]
action                         = "as-defs"
scope.include.id               = ["marks"]
scope.include.definition.names = [
  "DensityX",
  "DensityY",
  "SortOrder",
  "ChannelDomainValueSpec",
  "ChannelValueSpec",
  "ChannelValueIntervalSpec",
]
scope.include.child.nodes      = ["ClosedDict"]

[[convert.to_mlir.actions]]
action                         = "rename-fields"
scope.include.id               = ["inputs"]
scope.include.definition.nodes = ["ClosedDict"]
overrides                      = { as = "bind", from = "source" }

[[convert.to_mlir.actions]]
action                         = "rename-fields"
scope.include.id               = ["interactors"]
scope.include.definition.nodes = ["ClosedDict"]
overrides                      = { as = "bind" }

[[convert.to_mlir.actions]]
action                         = "rename-fields"
scope.include.id               = ["plot_from"]
scope.include.definition.nodes = ["ClosedDict"]
overrides                      = { from = "source" }

[[convert.to_mlir.actions]]
action                         = "rename-fields"
scope.include.id               = ["plot_legend"]
scope.include.definition.nodes = ["ClosedDict"]
# TODO @dangotbanned: Propose changing this the "for" override
# - "plot" means something completely different elsewhere
# - makes it more complex to translate back to JSON
# - cannot use `{"plot": "for"}`, without knowing the context
overrides                      = { as = "bind", for = "plot" }

[[convert.to_mlir.actions]]
action                          = "as-defs-field"
scope.include.id                = ["plot"]
scope.include.child.field_names = ["margins"]

[[convert.to_mlir.actions]]
action                          = "as-defs-field"
scope.include.id                = ["inputs"]
scope.include.definition.names  = ["Menu"]
scope.include.child.field_names = ["options"]

[[convert.to_mlir.actions]]
action                          = "plugin"
entry_point                     = "scripts.plugins.mlir_actions:fix_tip"
scope.include.id                = ["marks"]
scope.include.definition.nodes  = ["ClosedDict"]
scope.include.child.field_names = ["tip"]
