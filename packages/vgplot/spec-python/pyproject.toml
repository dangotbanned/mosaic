[project]
name            = "mosaic-spec"
description     = "Declarative specification of Mosaic-powered applications."
readme          = "README.md"
requires-python = ">=3.10"
dependencies    = [
  "typing-extensions>=4.16 ; python_full_version < '3.15'",
]
dynamic         = ["version"]

[dependency-groups]
dev    = ["ruff", { include-group = "gen" }, { include-group = "typing" }]
gen    = ["datamodel-code-generator"]
typing = ["pyright", "ty"]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.datamodel-codegen]
input-file-type         = "jsonschema"
custom-file-header      = "# NOTE: DO NOT EDIT."
custom-file-header-mode = "prepend"
enable-command-header   = true
disable-timestamp       = true
output-model-type       = "typing.TypedDict"
formatters              = ["ruff-check", "ruff-format"]
target-python-version   = "3.10"

use-generic-container-types = true
use-tuple-for-fixed-items   = true
use-type-checking-imports   = true
# use-type-alias              = true

collapse-reuse-models = true
skip-root-model       = true
reuse-model           = true
# keep-model-order = true
all-exports-scope     = "children"

# NOTE: Docs
use-schema-description    = true
# use-field-description = true
# use-attribute-docstrings = true
# use-single-line-docstring = true
# wrap-string-literal = true
use-title-as-name         = true
snake-case-field          = true
infer-union-variant-names = true

# https://datamodel-code-generator.koxudaxi.dev/presets/#practical-py310-20260619
# allow-population-by-field-name = true
# collapse-root-models = true
# enum-field-as-literal = "one"
# naming-strategy = "primary-first"
# set-default-enum-member = true
# strict-nullable = true
# use-annotated = true
# use-default-kwarg = true
# use-subclass-enum = true
# use-frozen-field = true

[tool.datamodel-codegen.profiles.spec]
input                   = "schema/"
output                  = "src/mosaic_spec/_gen/"
custom-file-header-mode = "replace"
custom-file-header      = "# NOTE: DO NOT EDIT.\n# Regenerate with: pnpm generate"

[tool.datamodel-codegen.profiles.draft-07]
url                     = "http://json-schema.org/draft-07/schema#"
output                  = "scripts/_json_schema.pyi"
model-name-map          = '{"CoreSchemaMetaSchema1": "JsonSchema", "SimpleTypes": "Primitive"}'
custom-file-header-mode = "replace"
custom-file-header      = """
'''Stubs for [json-schema draft-07](http://json-schema.org/draft-07/schema#).'''

# NOTE: DO NOT EDIT.
# Regenerate with: uv run datamodel-codegen --profile=draft-07 && pnpm run lint
"""

[tool.hatch.version]
path    = "package.json"
pattern = "\"version\": \"(?P<version>.+?)\""

[tool.hatch.build.targets.wheel]
packages = ["mosaic_spec"]

[tool.pyright]
ignore           = ["../**/.venv/"]                       # Do not display diagnostics in external source code
include          = ["src", "scripts", "*.py", "*.ipynb"]
typeCheckingMode = "standard"

[tool.ruff]
fix         = true
line-length = 100

[tool.ruff.format]
skip-magic-trailing-comma = true
quote-style               = "double"
line-ending               = "lf"
docstring-code-format     = true

[tool.ruff.lint]
extend-select                            = ["ALL"]
extend-safe-fixes                        = ["FA", "TC", "UP", "TID252", "EM", "TRY"]
future-annotations                       = true
flake8-tidy-imports.ban-relative-imports = "all"

isort = { split-on-trailing-comma = false, required-imports = ["from __future__ import annotations"] }

ignore = [
  "A001",     # builtin-variable-shadowing
  "A004",     # builtin-import-shadowing
  "ARG002",   # unused-method-argument
  "ANN401",   # any-type
  "COM812",   # missing-trailing-comma
  "D100",     # undocumented-public-module
  "D101",     # undocumented-public-class
  "D102",     # undocumented-public-method
  "D103",     # undocumented-public-function
  "D104",     # undocumented-public-package
  "D105",     # undocumented-magic-method
  "D107",     # undocumented-public-init
  "D203",     # incorrect-blank-line-before-class
  "D213",     # multi-line-summary-second-line
  "D400",     # missing-trailing-period
  "DTZ001",   # call-datetime-without-tzinfo
  "E501",     # line-too-long
  "FBT003",   # We enforce at definition site when it is a flag, not a value
  "FIX",      # flake8-fixme
  "PLC0415",  # `import` should be at the top-level of a file
  "PLR0913",  # too-many-arguments
  "PLR2004",  # magic-value-comparison
  "PLW1641",  # Object does not implement `__hash__` method
  "SLF001",   # private-member-access
  "TD003",    # missing-todo-link
  "TD004",    # missing-todo-colon
  "N801",     # capwords naming
  "N806",     # lowercase variable
  "S608",     # sql injection
  "PYI051",   # redundant-literal-union (opinionated)
  "PYI021",   # docstrings can be allowed in stubs
  "Q000",     # conflicts with formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*"                   = ["D", "S101"]
"**/*.pyi"                  = ["ERA001"]          # false positive for commented out code
"scripts/**.py"             = ["T201"]            # print is ok in scripts
# TODO @dangotbanned: Clean these up before writing to `mosaic.json`
"src/mosaic_spec/_gen/*.py" = ["RUF002", "D415"]
