[project]
name            = "mosaic-spec"
description     = "Declarative specification of Mosaic-powered applications."
readme          = "README.md"
requires-python = ">=3.10"
dependencies    = [
  "typing-extensions>=4.16 ; python_full_version < '3.15'",
]
dynamic         = ["version"]

[dependency-groups]
dev    = [
  "msgspec[toml,yaml]>=0.21.1",
  "polars>=1.43.2",
  "ruff",
  { include-group = "docs" },
  { include-group = "gen" },
  { include-group = "tests" },
  { include-group = "typing" }
]
docs   = [
  "griffe>=2.2.0",
  "griffe-inherited-docstrings>=1.1.3",
  "rumdl>=0.2.62",
]
gen    = [
  "datamodel-code-generator>=0.72.2",
  "rpds-py>=0.30.0",
]
repl   = [
  "ipykernel>=7.3.0",
  "rich>=15.0.0",
]
tests  = [
  "pytest>=9.1.1",
  "pytest-env>=1.7.0",
  "pytest-xdist>=3.8.0",
]
typing = [
  "pyrefly>=1.2.0",
  "pyright",
  "ty>=0.0.74",
  "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[tool.datamodel-codegen]
input-file-type         = "jsonschema"
custom-file-header      = "# NOTE: DO NOT EDIT."
custom-file-header-mode = "prepend"
enable-command-header   = true
disable-timestamp       = true
output-model-type       = "typing.TypedDict"
formatters              = []
target-python-version   = "3.10"

enum-field-as-literal             = "all"
use-generic-container-types       = true
use-tuple-for-fixed-items         = true
use-tuple-for-fixed-length-arrays = true
use-total-false-for-typed-dict    = true
use-type-alias-type               = true
use-type-checking-imports         = true

infer-union-variant-names = true
snake-case-field          = true
use-title-as-name         = true

all-exports-scope     = "children"
collapse-reuse-models = true
skip-root-model       = true
reuse-model           = true
use-exact-imports     = true        # aka import each symbol

# NOTE: Docs
use-schema-description    = true
use-field-description     = true
use-attribute-docstrings  = true
use-single-line-docstring = true

[tool.datamodel-codegen.profiles.spec]
input                   = "schema/"
output                  = "src/mosaic_spec/_gen/"
emit-model-metadata     = ".spec-dump-model/datamodel-code-generator-map.json"
strict-refs             = true
custom-file-header-mode = "replace"
custom-file-header      = "# NOTE: DO NOT EDIT.\n# Regenerate with: pnpm generate"
custom-template-dir     = "templates/datamodel-code-generator"
import-overrides        = '{"NotRequired": "mosaic_spec._typing_compat", "Required": "mosaic_spec._typing_compat", "TypeAliasType": "mosaic_spec._typing_compat", "TypeVar": "mosaic_spec._typing_compat", "TypedDict": "mosaic_spec._typing_compat"}'
use-title-as-name       = false

# NOTE: Enabled in the main config, but no longer produce a diff for this profile
collapse-reuse-models     = false
reuse-model               = false
infer-union-variant-names = false

[tool.hatch.version]
path    = "package.json"
pattern = "\"version\": \"(?P<version>.+?)\""

[tool.hatch.build]
dev-mode-dirs = [".", "src", "scripts", "tools"]

[tool.hatch.build.targets.wheel]
packages = ["mosaic_spec"]

[tool.pyrefly]
search-path      = [".", "src", "scripts", "tools", "tests"]
project-includes = [
  "src",
  "scripts",
  "tools",
  "*.py",
  "tests",
]

project-excludes = [
  "tools/codegen/typed_dict.py",  # https://github.com/facebook/pyrefly/issues/4556
]
# treat-all-caps-as-final = true (requires 1.3.0-dev.1 https://github.com/facebook/pyrefly/issues/3678)

preset = "strict"

[tool.pyrefly.errors]
missing-override-decorator = "ignore"

[[tool.pyrefly.sub-config]]
# Doesn't understand protocol being satisfied in `__init_subclass__`
matches                     = "tools/ir/mlir/actions.py"
errors.bad-instantiation    = "ignore"
errors.bad-class-definition = "ignore"

[tool.pyright]
extends               = "../../../pyproject.toml"
include               = ["src", "scripts", "tools", "*.py", "*.ipynb", "tests"]
executionEnvironments = [
  { root = "src", pythonVersion = "3.10" },
  { root = "tools", pythonVersion = "3.15" },
  { root = "scripts", pythonVersion = "3.15" },
]
defineConstant        = { "PYRIGHT" = true }

[tool.ruff]
fix            = true
line-length    = 100
extend         = "../../../pyproject.toml"
extend-exclude = ["typeshed"]
include        = ["src", "scripts", "tools", "*.py", "*.ipynb"]

[tool.ruff.per-file-target-version]
"scripts/*" = "py315"  # PEP 695 & PEP 728
"tools/*"   = "py315"  # PEP 695 & PEP 728
"*.ipynb"   = "py314"  # PEP 750

[tool.ruff.format]
skip-magic-trailing-comma = true
quote-style               = "double"
line-ending               = "lf"
docstring-code-format     = true

[tool.ruff.lint]
preview                                  = true
explicit-preview-rules                   = true
# NOTE: Using `tool.ruff.extend` isn't compatible with `["ALL"]`
extend-select                            = [
  "ERA",
  "YTT",
  "ANN",
  "S",
  "B",
  "A",
  "trailing-comma-on-bare-tuple",
  "C4",
  "DTZ",
  "boolean-type-hint-positional-argument",
  "EM",
  "EXE",
  "ISC",
  "ICN",
  "LOG",
  "G",
  "implicit-namespace-package",
  "PIE",
  "print",
  "PYI",
  "PT",
  "RET",
  "SIM",
  "TID",
  "TD",
  "PTH",
  "static-join-to-f-string",
  "I",
  "complex-structure",
  "NPY",
  "PD",
  "N",
  "PERF",
  "E",
  "W",
  "DOC",
  "D",
  "F",
  "PGH",
  "PL",
  "FURB",
  "TRY",
  "RUF",
  # explicit preview
  "too-many-locals",
  "too-many-boolean-expressions",
  "too-many-nested-blocks",
  "literal-membership",
  "unspecified-encoding",
  "docstring-extraneous-parameter",
  # ignored in parent
  "blind-except",
  "boolean-default-value-positional-argument",
  "exec-builtin",
  "useless-expression",
  "raw-string-in-exception",
  "f-string-in-exception",
  "useless-return",
  "implicit-string-concatenation-in-collection-literal",
  "invalid-all-object",
  "subprocess-run-without-check",
  "unused-noqa",
  "unsorted-dunder-all",
  "unsorted-imports",
  "undocumented-warn",
  "unused-function-argument",
  "raise-vanilla-class",
  "raise-vanilla-args",
  "raise-within-try",
  "hardcoded-sql-expression",
  "log-exception-outside-except-handler",
  # numpy/google docstring overrides
  "non-imperative-mood",
  "docstring-starts-with-this",
  "undocumented-param",
  "multi-line-summary-first-line",
]
extend-safe-fixes                        = [
  "FA",
  "TC",
  "UP",
  "relative-imports",
  "EM",
  "TRY",
  "literal-membership",
  "unspecified-encoding",
  "unnecessary-multiline-docstring"
]
future-annotations                       = true
flake8-builtins.ignorelist               = ["format", "input", "id"]
flake8-tidy-imports.ban-relative-imports = "all"
typing-modules                           = ["mosaic_spec._typing_compat"]
pydoclint.ignore-one-line-docstrings     = true
pydocstyle.convention                    = "google"

allowed-confusables = [
  "γ",                   # (GREEK SMALL LETTER GAMMA) https://en.wikipedia.org/wiki/Euler_angles
  "σ",                   # (GREEK SMALL LETTER SIGMA)
  "×",                   # (MULTIPLICATION SIGN)
]

ignore = [
  "builtin-variable-shadowing",
  "builtin-import-shadowing",
  "unused-method-argument",
  "any-type",
  "missing-trailing-comma",
  "prohibited-trailing-comma",
  "undocumented-public-module",
  "undocumented-public-class",
  "undocumented-public-method",
  "undocumented-public-function",
  "undocumented-public-package",
  "undocumented-magic-method",
  "undocumented-public-init",
  "multi-line-summary-second-line",
  "missing-blank-line-after-last-section",
  "call-datetime-without-tzinfo",
  "line-too-long",
  "FIX",
  "type-name-incorrect-variance",
  "import-outside-top-level",
  "too-many-arguments",
  "magic-value-comparison",
  "private-member-access",
  "missing-todo-link",
  "missing-todo-colon",
  "invalid-class-name",                     # capwords naming
  "non-lowercase-variable-in-function",
  "redundant-literal-union",                # (opinionated)
  "docstring-in-stub",                      # (opinionated)
  "unaliased-collections-abc-set-import",   # (opinionated)
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false
required-imports        = ["from __future__ import annotations"]
combine-as-imports      = true

[tool.ruff.lint.per-file-ignores]
"tests/*"              = ["D", "assert"]
"scripts/**.py"        = ["print"]
"tools/models/**/*.py" = [
  "missing-required-import",
  "typing-only-standard-library-import",
  "typing-only-first-party-import"
]

"src/mosaic_spec/_gen/*.py" = ["missing-terminal-punctuation"]

[tool.ruff.lint.pep8-naming]
extend-ignore-names = [
  "L",                   # typing.Literal
  "LS",                  # typing.LiteralString
  "A",                   # typing.Annotated
]

[tool.ty.src]
include = ["**/*.py", "**/*.pyi", "**/*.ipynb"]

[[tool.ty.overrides]]
# Needs to be configured in local workspace for VSCode too
# https://github.com/astral-sh/ty/issues/2410
include                 = ["tools/_rich_install.py"]
rules.unresolved-import = "ignore"

[tool.ty.environment]
python-version = "3.15"
